<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستشفى ابن سينا</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* خلفية متدرجة ومتحركة بين الأزرق والأحمر */
        body {
            background: linear-gradient(-45deg, #0056b3, #d9534f, #0275d8, #c9302c);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* اللوجو الشفاف والمتحرك في الخلفية */
        .bg-logo {
            position: absolute;
            width: 450px;
            height: 450px;
            z-index: 1;
            opacity: 0.18;
            animation: rotateLogo 25s linear infinite;
            pointer-events: none;
        }

        .bg-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        @keyframes rotateLogo {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .container {
            background-color: rgba(255, 255, 255, 0.92);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            text-align: center;
            max-width: 520px;
            width: 100%;
            backdrop-filter: blur(8px);
            position: relative;
            z-index: 2;
        }

        h1 {
            color: #0056b3;
            margin-bottom: 15px;
            font-size: 28px;
        }

        p {
            color: #555;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .info-section {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
            border-right: 4px solid #0056b3;
            text-align: right;
        }

        .info-item {
            margin-bottom: 10px;
            font-size: 15px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-item:last-child {
            margin-bottom: 0;
        }

        .info-title {
            font-weight: bold;
            color: #0056b3;
        }

        .phone-numbers {
            direction: ltr;
            display: inline-block;
        }

        .btn {
            display: inline-block;
            background-color: #0056b3;
            color: #fff;
            padding: 12px 30px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .btn:hover {
            background-color: #003d82;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- الشعار الشفاف المتحرك -->
    <div class="bg-logo">
        <img src="Logo HD.png" alt="شعار مستشفى ابن سينا">
    </div>

    <div class="container">
        <h1>مرحباً بكم في مستشفى ابن سينا</h1>
        <p>نحن هنا لرعايتكم وتقديم أفضل الخدمات الطبية المتميزة بأعلى معايير الجودة والراحة.</p>
        
        <div class="info-section">
            <div class="info-item">
                <span class="info-title">📍 العنوان:</span>
                <span>العاشر من رمضان - المجاورة العاشر</span>
            </div>
            <div class="info-item">
                <span class="info-title">📞 أرقام التواصل:</span>
                <span class="phone-numbers">01222243156 / 01222243157</span>
            </div>
        </div>

        <a href="#" class="btn">الدخول للموقع</a>
    </div>

</body>
</html>
